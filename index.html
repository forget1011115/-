<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title id="web-title">物品繳交管理系統</title>
    <style>
        :root { --primary: #3498db; --success: #2ecc71; --bg: #f4f7f6; --header-bg: #2c3e50; --danger: #e74c3c; --warning: #f39c12; --info: #9b59b6; --history-bg: #fff3e0; --history-border: #ffb74d; }
        html, body { height: 100vh; width: 100vw; margin: 0; padding: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); font-family: "Microsoft JhengHei", sans-serif; transition: background 0.3s; }
        .container { flex: 1; display: flex; flex-direction: column; padding: 8px; box-sizing: border-box; height: 100vh; }
        .card { background: white; padding: 8px 12px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); flex-shrink: 0; transition: background 0.3s, border 0.3s; }
        .history-mode-card { background: var(--history-bg) !important; border: 2px solid var(--history-border) !important; }
        .hidden { display: none !important; }
        #title-input { width: 100%; padding: 6px; font-size: 15px; border: 2px solid #ccc; border-radius: 6px; box-sizing: border-box; height: 36px; }
        #items-input, #users-input { width: 100%; height: 150px; padding: 8px; font-size: 15px; border: 2px solid #ccc; border-radius: 6px; box-sizing: border-box; resize: none; line-height: 1.4; font-family: inherit; }
        .header-row-1 { display: flex; justify-content: space-between; align-items: center; gap: 10px; height: 42px; }
        .row-1-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .activity-name { font-size: 26px; font-weight: 900; color: var(--primary); margin: 0; line-height: 1; white-space: nowrap; }
        
        .date-picker-container { display: flex; align-items: center; gap: 4px; background: #fff; padding: 4px 8px; border-radius: 6px; border: 2px solid var(--primary); }
        .date-picker-container.is-history { border-color: var(--warning); background: #ffe0b2; }
        #target-date-input { font-size: 14px; font-weight: bold; border: none; background: transparent; outline: none; cursor: pointer; color: #333; }

        .item-checker-inline { display: flex; align-items: center; gap: 8px; background: #e1f5fe; padding: 4px 10px; border-radius: 6px; border: 1px solid #b3e5fc; overflow-x: auto; white-space: nowrap; flex: 1; }
        .item-checker-inline label { font-size: 14px; font-weight: bold; color: #01579b; white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 4px; }
        .row-1-right { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
        .stat-badge { font-size: 14px; font-weight: bold; color: #2c3e50; background: #ecf0f1; padding: 6px 12px; border-radius: 6px; border: 1px solid #bdc3c7; }
        
        .header-row-2 { display: flex; justify-content: space-between; align-items: center; gap: 10px; height: 42px; margin-top: 6px; }
        .row-2-left { display: flex; align-items: center; gap: 8px; }
        
        #scan-input { width: 130px; padding: 6px 8px; font-size: 15px; border: 2px solid var(--primary); border-radius: 6px; text-align: center; box-sizing: border-box; background: #fffde7; outline: none; }

        .row-2-right { display: flex; gap: 6px; align-items: center; }
        .matrix-container { flex: 1; overflow: auto; background: white; border: 2px solid #ddd; margin-top: 8px; min-height: 0; }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { background: var(--header-bg); color: white; padding: 4px; border: 1px solid #444; height: 32px; font-size: 1.1rem; position: sticky; top: 0; z-index: 10; box-sizing: border-box; }
        tr { height: 21px; box-sizing: border-box; }
        .name-col { background: #fdfdfd; font-weight: 900; position: sticky; left: 0; z-index: 9; width: 140px; color: #000; text-align: left; padding-left: 8px; border-right: 3px solid var(--primary); white-space: nowrap; font-size: 0.85rem; letter-spacing: -1px; cursor: pointer; }
        td { border: 1px solid #dfe6e9; text-align: center; padding: 0; font-size: 0.85rem; box-sizing: border-box; }
        .cell-interactive { cursor: pointer; }
        .cell-interactive:hover { opacity: 0.7; }
        .received { background: var(--success) !important; color: white !important; font-weight: bold; }
        .need-fix { background: var(--warning) !important; color: white !important; font-weight: bold; }
        .leave { background: #95a5a6 !important; color: white !important; font-weight: bold; }
        .empty-row { background: #f2f2f2 !important; color: #bbb !important; cursor: not-allowed; }
        
        .btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; color: white; font-weight: bold; transition: 0.2s; white-space: nowrap; }
        .btn:hover { opacity: 0.8; }
        
        #modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .modal-content { background: white; width: 80%; max-width: 600px; max-height: 80vh; border-radius: 12px; padding: 20px; display: flex; flex-direction: column; }
        .modal-header { border-bottom: 2px solid #eee; padding-bottom: 8px; margin-bottom: 12px; font-size: 22px; font-weight: bold; color: var(--danger); display: flex; justify-content: space-between; }
        .modal-body { flex: 1; overflow-y: auto; }
        .missing-group { margin-bottom: 12px; }
        .missing-item-title { font-weight: bold; background: #eee; padding: 3px 8px; border-radius: 4px; display: block; margin-bottom: 4px; }
        .missing-names { font-size: 16px; line-height: 1.6; color: #333; padding-left: 8px; }
        .setup-actions { display: flex; gap: 8px; margin-top: 12px; }
        .btn-main { flex: 1; padding: 12px; font-size: 16px; }
        .mode-btn { border: 2px solid transparent; opacity: 0.6; }
        .mode-btn.active { opacity: 1; border-color: #000; transform: scale(1.03); }

        @keyframes pulse-red {
            0% { background-color: #e74c3c; border-color: #c0392b; box-shadow: 0 0 0px #e74c3c; }
            50% { background-color: #ff0000; border-color: #000000; box-shadow: 0 0 10px #ff0000; }
            100% { background-color: #e74c3c; border-color: #c0392b; box-shadow: 0 0 0px #e74c3c; }
        }
        .btn-delete-active { animation: pulse-red 1s infinite !important; opacity: 1 !important; border: 2px solid #000 !important; }
    </style>
</head>
<body>
<div class="container">
    <div id="setup-panel" class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <h2 style="margin:0; font-size: 20px;">⚙️ 系統設定</h2>
            <div style="display: flex; gap: 6px;">
                <button class="btn" style="background:#7f8c8d;" onclick="exportConfig()">📤 備份設定檔</button>
                <button class="btn" style="background:#7f8c8d;" onclick="document.getElementById('import-file').click();">📥 還原設定檔</button>
                <input type="file" id="import-file" style="display:none;" accept=".json" onchange="importConfig(event)">
                <button class="btn" style="background:var(--danger); opacity: 0.7;" onclick="reset()">🧹 徹底清空</button>
            </div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr 1fr; gap:8px;">
            <div><label style="font-size:11px;">活動名稱：</label><input type="text" id="title-input" style="width:100%; padding:6px; box-sizing:border-box;"></div>
            <div><label style="font-size:11px;">物品設定 (每行一個)：</label><textarea id="items-input" placeholder="例如：&#10;生甲&#10;生乙"></textarea></div>
            <div><label style="font-size:11px;">人員名單 (每行一個)：</label><textarea id="users-input" placeholder="張三&#10;李四"></textarea></div>
        </div>
        <div style="margin-top:8px;">
            <label style="font-size:11px;">GAS Web App URL (用於同步試算表)：</label>
            <input type="text" id="gas-url-input" style="width:100%; padding:6px; box-sizing:border-box;" placeholder="https://script.google.com/macros/s/.../exec">
        </div>
        <div class="setup-actions">
            <button class="btn btn-main" style="background:var(--primary);" onclick="initAndExportLabels()">💾 儲存並導出標籤檔</button>
            <button class="btn btn-main" style="background:var(--info);" onclick="startTracking()">🚀 直接進入/返回清單頁面</button>
        </div>
    </div>

    <div id="tracking-panel" class="container hidden" style="padding:0;">
        <div class="card" id="top-card-container">
            <div class="header-row-1">
                <div class="row-1-left">
                    <h1 class="activity-name" id="display-title">活動名稱</h1>
                    <div id="date-picker-box" class="date-picker-container">
                        <span style="font-size:12px; font-weight:bold;">📅 日期:</span>
                        <input type="date" id="target-date-input" onchange="onDateChanged()">
                        <button id="btn-today" class="btn hidden" style="background:var(--danger); padding:3px 6px; font-size:11px;" onclick="resetToToday()">回今天</button>
                    </div>
                    <div id="item-checker-inline" class="item-checker-inline"></div>
                </div>
                <div class="row-1-right">
                    <button class="btn" style="background: var(--info);" onclick="addNewTempItem()">➕ 新增項目</button>
                    <button id="btn-holiday-toggle" class="btn" style="background:var(--success);" onclick="toggleHolidayMode()">🟢 推播中</button>
                    <button class="btn" style="background:var(--primary);" onclick="syncToGAS()">☁️ 同步至試算表</button>
                </div>
            </div>
                        
            <div class="header-row-2">
                <div class="row-2-left">
                    <input type="text" id="scan-input" placeholder="掃描顯示..." autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
                    <button class="btn mode-btn active" id="btn-mode-normal" style="background:var(--success);" onclick="setMode('normal')">🟢 已繳</button>
                    <button class="btn mode-btn" id="btn-mode-fix" style="background:var(--warning);" onclick="setMode('fix')">🟡 未訂正</button>
                    <button class="btn mode-btn" id="btn-mode-leave" style="background:#95a5a6;" onclick="setMode('leave')">🔵 點擊姓名請假</button>
                    <button class="btn mode-btn" id="btn-mode-delete" style="background:var(--danger);" onclick="setMode('delete')">🔴 銷錯</button>
                </div>
                <div class="row-2-right">
                    <span id="stat-info" class="stat-badge">已處理：0/0</span>
                    <button class="btn" style="background:#27ae60;" onclick="markCheckedItemsAsAllOk()">⚡ 勾選項全繳</button>
                    <button class="btn" style="background:var(--danger);" onclick="showMissingReport()">🏁 清點完成</button>
                    <button class="btn" style="background:#7f8c8d;" onclick="clearRecordsOnly()">🔄 歸零清點</button>
                    <button class="btn" style="background:var(--warning);" onclick="backToSetup()">✏️ 修改設定</button>
                </div>
            </div>
        </div>
        <div class="matrix-container" id="matrix-html"></div>
    </div>
</div>

<div id="modal-overlay" class="hidden">
    <div class="modal-content">
        <div class="modal-header" id="modal-title-text">
            <span>❌ 缺交/未訂正名單報告</span>
            <button onclick="closeModal()" style="background:none; border:none; font-size:22px; cursor:pointer;">×</button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <button class="btn" style="background:#333; margin-top:12px; padding:10px;" onclick="closeModal()">關閉視窗</button>
    </div>
</div>

<script>
const storageKey = 'inv_matrix_v2026_clean_history_v2'; 
const DEFAULT_GAS_URL = "https://script.google.com/macros/s/AKfycbwdPn22dQ_9fmrrqwcNj8Rxq0UzGXgQACadPJIFlU9-LpyEdtJgdpBJl0yy9ZFBGJE/exec";

let db = { 
    title: "510作業繳交", 
    items: ["聯絡簿","生甲","生乙","語詞","造句","國習","數課","數習","週記","其他","考試本"], 
    users: ["劉則言","李侑育","陳禹橙","邱柏禹","陳彥菥","謝宏諺","林廷瑋","許文愷","林德峻","吳泓逸","林宥辰","陳裕佳","許書偉","林冪緹","蔡家婕","吳可晴","楊昕艾","吳芸妮","賴品希","陳雨昕","陳采妍","石珈瑜","賴品韻","郭亮妤","宋玟潔"], 
    historyRecords: {}, 
    gasUrl: DEFAULT_GAS_URL,
    tempItems: {} 
};
let currentMode = 'normal';
let currentDateStr = getTodayFormatted();
let isHolidayMuted = false;

function getTodayFormatted() {
    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    return `${yyyy}/${mm}/${dd}`;
}

function getDatePickerValue() {
    const val = document.getElementById('target-date-input').value;
    if (!val) return getTodayFormatted();
    return val.replace(/-/g, '/');
}

function setDatePickerValue(dateStr) {
    document.getElementById('target-date-input').value = dateStr.replace(/\//g, '-');
}

function onDateChanged() {
    currentDateStr = getDatePickerValue();
    updateHistoryVisualState();
    fetchHistoryDataFromGAS(currentDateStr);
}

function updateHolidayBtnUI() {
    const btn = document.getElementById('btn-holiday-toggle');
    if (!btn) return;
    if (isHolidayMuted) {
        btn.style.background = 'var(--danger)';
        btn.innerText = '🔴 推播關';
    } else {
        btn.style.background = 'var(--success)';
        btn.innerText = '🟢 推播中';
    }
}

function toggleHolidayMode() {
    const url = getGasUrl();
    if (!url) return alert("❌ 請先填寫 GAS URL！");

    const targetStatus = !isHolidayMuted;
    const actionName = targetStatus ? "enableHolidayMode" : "disableHolidayMode";

    fetch(`${url}?action=${actionName}`)
    .then(res => res.json())
    .then(data => {
        isHolidayMuted = targetStatus;
        updateHolidayBtnUI();
        alert(isHolidayMuted ? "🛑 已切換為【連假模式】！夜間推播暫停。" : "🟢 已恢復【平時模式】！夜間將正常自動推播。");
    })
    .catch(err => {
        fetch(url, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: actionName }),
            redirect: "follow"
        })
        .then(() => {
            isHolidayMuted = targetStatus;
            updateHolidayBtnUI();
            alert(isHolidayMuted ? "🛑 已切換為【連假模式】！夜間推播暫停。" : "🟢 已恢復【平時模式】！夜間將正常自動推播。");
        })
        .catch(e => alert("❌ 切換狀態失敗，請檢查網路連線。"));
    });
}

function fetchHistoryDataFromGAS(dateStr) {
    const url = getGasUrl();
    if (!url) {
        renderMatrix();
        return;
    }

    console.log(`🌐 正在向雲端查詢 ${dateStr} 的歷史記錄...`);
    fetch(`${url}?action=getHistoryDateData&date=${dateStr}`)
    .then(res => res.json())
    .then(resData => {
        let fetchedRecs = {};
        if (resData.status === "success") {
            if (typeof resData.isHoliday !== 'undefined') {
                isHolidayMuted = resData.isHoliday;
                updateHolidayBtnUI();
            }
            if (resData.customItemNames && resData.customItemNames[dateStr]) {
                if (!db.customItemNames) db.customItemNames = {};
                db.customItemNames[dateStr] = resData.customItemNames[dateStr];
            }
            if (resData.tempItems && resData.tempItems[dateStr]) {
                if (!db.tempItems) db.tempItems = {};
                db.tempItems[dateStr] = resData.tempItems[dateStr];
            }
            if (resData.itemsData) {
                const activeItemsList = getAllItemsForDate();
                activeItemsList.forEach((itemName, iIdx) => {
                    const letter = String.fromCharCode(65 + iIdx);
                    if (resData.itemsData[itemName]) {
                        const itemRecs = resData.itemsData[itemName];
                        Object.keys(itemRecs).forEach(uCode => {
                            const cleanUCode = uCode.toString().padStart(3, '0');
                            const code = `${letter}-${cleanUCode}`;
                            fetchedRecs[code] = itemRecs[uCode];
                        });
                    }
                });
            }
            db.historyRecords[dateStr] = fetchedRecs;
            save();
            renderItemCheckers();
            console.log(`✅ 成功載入 ${dateStr} 的歷史記錄並渲染！`);
        }
        renderMatrix();
    })
    .catch(err => {
        console.error("抓取歷史資料失敗:", err);
        renderItemCheckers();
        renderMatrix();
    });
}

function resetToToday() {
    currentDateStr = getTodayFormatted();
    setDatePickerValue(currentDateStr);
    updateHistoryVisualState();
    renderItemCheckers();
    renderMatrix();
}

function updateHistoryVisualState() {
    const today = getTodayFormatted();
    const isHistory = (currentDateStr !== today);
    const topCard = document.getElementById('top-card-container');
    const dateBox = document.getElementById('date-picker-box');
    const btnToday = document.getElementById('btn-today');

    if (isHistory) {
        topCard.classList.add('history-mode-card');
        dateBox.classList.add('is-history');
        btnToday.classList.remove('hidden');
    } else {
        topCard.classList.remove('history-mode-card');
        dateBox.classList.remove('is-history');
        btnToday.classList.add('hidden');
    }
}

function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => {
        b.classList.remove('active');
        b.classList.remove('btn-delete-active');
    });

    if(mode === 'normal') document.getElementById('btn-mode-normal').classList.add('active');
    if(mode === 'fix') document.getElementById('btn-mode-fix').classList.add('active');
    if(mode === 'leave') document.getElementById('btn-mode-leave').classList.add('active');
    if(mode === 'delete') {
        const btnDelete = document.getElementById('btn-mode-delete');
        btnDelete.classList.add('active', 'btn-delete-active');
    }
    renderMatrix();
}

function getCleanInputs() {
    let items = document.getElementById('items-input').value.trim().split('\n').filter(s => s);
    let rawUsers = document.getElementById('users-input').value.split('\n');
    while(rawUsers.length > 0 && rawUsers[rawUsers.length - 1].trim() === "") { rawUsers.pop(); }
    let users = rawUsers.map(s => {
        let trimmed = s.trim();
        return trimmed === "" ? "空" : trimmed;
    });
    return { items, users };
}

function importConfig(event) {
    const file = event.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const imported = JSON.parse(e.target.result);
            if (Array.isArray(imported.items) && Array.isArray(imported.users)) {
                let mergedHistory = imported.historyRecords || {};
                if (imported.records && Object.keys(imported.records).length > 0) {
                    mergedHistory[getTodayFormatted()] = imported.records;
                }

                db = { 
                    title: imported.title || "物品清單", 
                    items: imported.items, 
                    users: imported.users, 
                    historyRecords: mergedHistory,
                    gasUrl: imported.gasUrl || DEFAULT_GAS_URL,
                    customItemNames: imported.customItemNames || {},
                    tempItems: imported.tempItems || {}
                };
                save(); 
                alert("還原成功！資料已完全載入。"); 
                location.reload(); 
            } else { alert("檔案內容格式不符。"); }
        } catch (err) { alert("無法讀取檔案。"); }
    };
    reader.readAsText(file);
}

function exportConfig() {
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${db.title || '清單設定'}_備份.json`; a.click();
}

function save() { 
    const inputUrl = document.getElementById('gas-url-input').value.trim();
    db.gasUrl = inputUrl || db.gasUrl || DEFAULT_GAS_URL;
    localStorage.setItem(storageKey, JSON.stringify(db)); 
}

function load() {
    const s = localStorage.getItem(storageKey);
    if (s) {
        try {
            const loaded = JSON.parse(s);
            if(loaded.users && loaded.users.length) db = loaded;
            if (loaded.records && !loaded.historyRecords) {
                db.historyRecords = { [getTodayFormatted()]: loaded.records };
            }
        } catch(e) {}
    }
    if (!db.gasUrl) db.gasUrl = DEFAULT_GAS_URL;
    if (!db.historyRecords) db.historyRecords = {};
    if (!db.customItemNames) db.customItemNames = {};
    if (!db.tempItems) db.tempItems = {};
    
    document.getElementById('title-input').value = db.title || "";
    document.getElementById('items-input').value = (db.items || []).join('\n');
    document.getElementById('users-input').value = (db.users || []).join('\n');
    document.getElementById('gas-url-input').value = db.gasUrl;
    
    currentDateStr = getTodayFormatted();
    setDatePickerValue(currentDateStr);

    if(db.users && db.users.length) {
        startTracking();
    }
}

function initAndExportLabels() {
    const inputs = getCleanInputs(); if (!inputs.items.length || !inputs.users.length) return alert("不可空白");
    db.title = document.getElementById('title-input').value.trim(); db.items = inputs.items; db.users = inputs.users;
    let csv = "\uFEFF"; const cols = 7; let all = [];
    db.items.forEach((it, iIdx) => {
        const letter = String.fromCharCode(65 + iIdx);
        db.users.forEach((u, uIdx) => {
            const uCode = (uIdx + 1).toString().padStart(3, '0');
            if (u.trim() && u.trim() !== "空" && u.trim() !== "從缺") {
                all.push({t:`${it} (${letter}-${uCode})`, c:`*${letter}-${uCode}*`});
            }
        });
    });
    for (let i = 0; i < all.length; i += cols) {
        let rT = [], rC = [];
        for (let j = 0; j < cols; j++) {
            if (i+j < all.length) { rT.push(all[i+j].t); rC.push(all[i+j].c); } else { rT.push(""); rC.push(""); }
        }
        csv += rT.join(",") + "\n" + rC.join(",") + "\n\n";
    }
    const b = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = `${db.title}_標籤.csv`; a.click();
    startTracking();
}

function startTracking() {
    const inputs = getCleanInputs(); if (!inputs.items.length || !inputs.users.length) return alert("請先完成設定");
    db.items = inputs.items; db.users = inputs.users; db.title = document.getElementById('title-input').value.trim() || "物品清單";
    document.getElementById('setup-panel').classList.add('hidden');
    document.getElementById('tracking-panel').classList.remove('hidden');
    document.getElementById('display-title').innerText = db.title;
        
    renderItemCheckers();
    setDatePickerValue(currentDateStr);
    updateHistoryVisualState();
    renderMatrix(); 
    save();
}

function getAllItemsForDate() {
    let list = [...db.items];
    if (db.tempItems && db.tempItems[currentDateStr]) {
        list = list.concat(db.tempItems[currentDateStr]);
    }
    return list;
}

function addNewTempItem() {
    let newItemName = prompt("➕ 請輸入今天要新增的臨時項目名稱（例如：國卷、回條）：");
    if (!newItemName || newItemName.trim() === "") return;
    newItemName = newItemName.trim();

    if (!db.tempItems) db.tempItems = {};
    if (!db.tempItems[currentDateStr]) db.tempItems[currentDateStr] = [];
    db.tempItems[currentDateStr].push(newItemName);

    renderItemCheckers();
    renderMatrix();
    save();
    syncToGASSilent();
    alert(`✅ 成功新增臨時項目【${newItemName}】！表格右側已自動長出對應欄位。`);
}

function getActualItemName(iIdx) {
    const allItems = getAllItemsForDate();
    const originalName = allItems[iIdx];
    if (iIdx < db.items.length && db.customItemNames && db.customItemNames[currentDateStr] && db.customItemNames[currentDateStr][originalName]) {
        return db.customItemNames[currentDateStr][originalName];
    }
    return originalName;
}

function renderItemCheckers() {
    const checkerArea = document.getElementById('item-checker-inline'); 
    if(!checkerArea) return;
    
    const checkedIndices = Array.from(document.querySelectorAll('.target-item:checked')).map(el => parseInt(el.value));
    
    checkerArea.innerHTML = '';
    const allItems = getAllItemsForDate();
    allItems.forEach((item, idx) => {
        const displayName = getActualItemName(idx);
        const isChecked = checkedIndices.includes(idx) ? 'checked' : '';
        checkerArea.innerHTML += `<label><input type="checkbox" class="target-item" value="${idx}" ${isChecked}> ${displayName}</label>`;
    });
}

function autoCheckItemByLetter(letter) {
    const itemIndex = letter.charCodeAt(0) - 65;
    const checkbox = document.querySelector(`.target-item[value="${itemIndex}"]`);
    if (checkbox && !checkbox.checked) { checkbox.checked = true; }
}

function getCurrentDateRecords() {
    if (!db.historyRecords[currentDateStr]) {
        db.historyRecords[currentDateStr] = {};
    }
    return db.historyRecords[currentDateStr];
}

function autoCheckActiveItemsForCurrentDate() {
    const recs = getCurrentDateRecords();
    const allItems = getAllItemsForDate();
    allItems.forEach((itemName, iIdx) => {
        const letter = String.fromCharCode(65 + iIdx);
        const hasRecord = Object.keys(recs).some(code => code.startsWith(`${letter}-`));
        if (hasRecord) { autoCheckItemByLetter(letter); }
    });
}

function markCheckedItemsAsAllOk() {
    const checkedTargets = Array.from(document.querySelectorAll('.target-item:checked')).map(el => parseInt(el.value));
    if (checkedTargets.length === 0) return alert("⚠️ 請先在最上方勾選要設定『勾選項全繳』的作業項目！");

    const recs = getCurrentDateRecords();
    checkedTargets.forEach(iIdx => {
        const letter = String.fromCharCode(65 + iIdx);
        db.users.forEach((u, uIdx) => {
            if (u.trim() && u.trim() !== "空" && u.trim() !== "從缺") {
                const uCode = (uIdx + 1).toString().padStart(3, '0');
                recs[`${letter}-${uCode}`] = 'ok';
            }
        });
    });

    renderMatrix(); 
    save();
    syncToGASSilent();
}

function renderMatrix() {
    const container = document.getElementById('matrix-html'); if(!container) return;
    const recs = getCurrentDateRecords();
    const allItems = getAllItemsForDate();
    
    let h = `<table><thead><tr><th class="name-col">姓名 (${currentDateStr})</th>`;
    allItems.forEach((it, iIdx) => {
        const displayName = getActualItemName(iIdx);
        h += `<th>${displayName}</th>`;
    });
    h += `</tr></thead><tbody>`; 
    
    db.users.forEach((u, uIdx) => {
        const isEmpty = !u.trim() || u.trim() === "空" || u.trim() === "從缺";
        const uCode = (uIdx + 1).toString().padStart(3, '0');
        h += `<tr class="${isEmpty ? 'empty-row' : ''}">`;
        h += `<td class="name-col" onclick="handleUserClick(${uIdx})">${isEmpty ? '('+uCode+' 空)' : u}</td>`;
        
        allItems.forEach((_, iIdx) => {
            const code = `${String.fromCharCode(65 + iIdx)}-${uCode}`;
            const status = recs[code] || 'none';
            let cssClass = 'cell-interactive ';
            if(status === 'ok') cssClass += 'received';
            if(status === 'fix') cssClass += 'need-fix';
            if(status === 'leave') cssClass += 'leave';
            
            h += isEmpty ? `<td>-</td>` : `<td id="cell-${code}" class="${cssClass}" onclick="handleCellClick('${code}', ${iIdx})">${code}</td>`;
        });
        h += `</tr>`;
    });
    
    container.innerHTML = h + `</tbody></table>`; 
    updateStats();
}

function handleUserClick(uIdx) {
    if (currentMode !== 'leave') return;
    const uCode = (uIdx + 1).toString().padStart(3, '0');
    const recs = getCurrentDateRecords();
    const allItems = getAllItemsForDate();
    allItems.forEach((_, iIdx) => {
        const letter = String.fromCharCode(65 + iIdx);
        const code = `${letter}-${uCode}`;
        recs[code] = 'leave';
        autoCheckItemByLetter(letter);
    });
    renderMatrix(); 
    save();
    syncToGASSilent();
}

function handleCellClick(code, iIdx) {
    const allItems = getAllItemsForDate();
    const originalName = allItems[iIdx];
    const recs = getCurrentDateRecords();

    if (originalName === "其他" || originalName.includes("其他")) {
        let currentCustomName = getActualItemName(iIdx);
        let actionChoice = prompt(`📌 您點擊了【${currentCustomName}】的格子。\n請輸入新的具體名稱（或按取消以直接切換狀態）：`, currentCustomName);
        
        if (actionChoice !== null && actionChoice.trim() !== "" && actionChoice.trim() !== currentCustomName) {
            if (!db.customItemNames) db.customItemNames = {};
            if (!db.customItemNames[currentDateStr]) db.customItemNames[currentDateStr] = {};
            db.customItemNames[currentDateStr][originalName] = actionChoice.trim();
            renderItemCheckers();
            renderMatrix();
            save();
            syncToGASSilent();
            return;
        }
    }

    if (currentMode === 'normal') {
        recs[code] = 'ok';
        autoCheckItemByLetter(String.fromCharCode(65 + iIdx));
    } else if (currentMode === 'fix') {
        recs[code] = 'fix';
        autoCheckItemByLetter(String.fromCharCode(65 + iIdx));
    } else if (currentMode === 'delete') {
        if (recs[code]) delete recs[code];
    }
    renderMatrix();
    save();
    syncToGASSilent();
}

let scanBuffer = "";
let scanTimer = null;

window.addEventListener('keydown', e => {
    const isTrackingActive = !document.getElementById('tracking-panel').classList.contains('hidden');
    const isModalActive = !document.getElementById('modal-overlay').classList.contains('hidden');
    if (!isTrackingActive || isModalActive) return;

    if (['INPUT', 'TEXTAREA'].includes(e.target.tagName) && e.target.id !== 'scan-input') return;

    if (e.key === 'Enter') {
        e.preventDefault();
        processBarcode(scanBuffer);
        scanBuffer = "";
        return;
    }

    let char = '';
    if (e.key.length === 1) {
        char = e.key;
    } else if (e.code && e.code.startsWith('Key')) {
        char = e.code.replace('Key', '');
    } else if (e.code && e.code.startsWith('Digit')) {
        char = e.code.replace('Digit', '');
    } else if (e.code === 'Minus' || e.code === 'NumpadSubtract') {
        char = '-';
    }

    if (char) {
        scanBuffer += char.toUpperCase();
        
        const scanInputBox = document.getElementById('scan-input');
        if (scanInputBox) scanInputBox.value = scanBuffer;

        clearTimeout(scanTimer);
        scanTimer = setTimeout(() => {
            if (scanBuffer.length >= 5) {
                processBarcode(scanBuffer);
                scanBuffer = "";
                const scanInputBox = document.getElementById('scan-input');
                if (scanInputBox) scanInputBox.value = "";
            }
        }, 80);
    }
});

function processBarcode(rawVal) {
    let cleanVal = rawVal.replace(/\*/g, '').trim();
    if (cleanVal.length >= 5) {
        const targetCode = cleanVal.substring(0, 5);
        const cell = document.getElementById(`cell-${targetCode}`);
        if (cell && !cell.parentNode.classList.contains('empty-row')) {
            const letter = targetCode.charAt(0);
            const recs = getCurrentDateRecords();
            if (currentMode === 'normal') recs[targetCode] = 'ok';
            if (currentMode === 'fix') recs[targetCode] = 'fix';
            if (currentMode === 'delete') {
                delete recs[targetCode];
            }
            if (currentMode !== 'delete') {
                autoCheckItemByLetter(letter);
            }
            renderMatrix(); 
            save();
            syncToGASSilent();
        }
    }
}

function showMissingReport() {
    autoCheckActiveItemsForCurrentDate();
    const checkedTargets = Array.from(document.querySelectorAll('.target-item:checked')).map(el => parseInt(el.value));
    if (checkedTargets.length === 0) return alert("⚠️ 請先在最上方勾選本次要統計的項目！");
    
    const recs = getCurrentDateRecords();
    let reportHtml = ""; let found = false;
    
    checkedTargets.forEach(itemIdx => {
        const itemName = getActualItemName(itemIdx);
        const letter = String.fromCharCode(65 + itemIdx); 
        let missing = [];
        db.users.forEach((u, uIdx) => {
            if (u.trim() && u.trim() !== "空" && u.trim() !== "從缺") {
                const code = `${letter}-${(uIdx+1).toString().padStart(3,'0')}`; 
                const status = recs[code];
                if (!status || status === 'none') missing.push(`${u} (未繳)`);
                if (status === 'fix') missing.push(`${u} (未訂正)`);
            }
        });
        if (missing.length > 0) { found = true; reportHtml += `<div class="missing-group"><span class="missing-item-title">📦 ${itemName}</span><div class="missing-names">${missing.join('、')}</div></div>`; }
    });
    
    document.getElementById('modal-title-text').innerHTML = `<span>❌ ${currentDateStr} 缺交/未訂正名單</span><button onclick="closeModal()" style="background:none; border:none; font-size:22px; cursor:pointer;">×</button>`;
    document.getElementById('modal-body').innerHTML = found ? reportHtml : "<div style='text-align:center; color:green; font-size:18px; padding:15px;'>✅ 本次統計項目已全數清單完畢！</div>";
    document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal() { 
    document.getElementById('modal-overlay').classList.add('hidden'); 
}

function updateStats() {
    let total = 0; if(!db.users) return;
    const allItems = getAllItemsForDate();
    db.users.forEach(u => { if(u.trim() && u.trim() !== "空" && u.trim() !== "從缺") total += allItems.length; });
    const statElem = document.getElementById('stat-info');
    let count = 0;
    const recs = getCurrentDateRecords();
    Object.values(recs).forEach(v => { if(v === 'ok' || v === 'fix') count++; });
    if (statElem) { statElem.innerText = `已處理 (${currentDateStr})：${count}/${total}`; }
}

function backToSetup() { document.getElementById('setup-panel').classList.remove('hidden'); document.getElementById('tracking-panel').classList.add('hidden'); }

function clearRecordsOnly() { 
    if(confirm(`確定將【${currentDateStr}】的清單紀錄歸零並取消所有作業選項勾選？`)) { 
        const recs = getCurrentDateRecords();
        for (let key in recs) delete recs[key];
        document.querySelectorAll('.target-item').forEach(el => el.checked = false);
        renderMatrix(); 
        save(); 
        syncToGASSilent();
    } 
}

let syncTimer = null;

function getGasUrl() {
    const inputVal = document.getElementById('gas-url-input').value.trim();
    return inputVal || db.gasUrl || DEFAULT_GAS_URL;
}

function getPayloadCustomNamesMap() {
    let map = {};
    if (db.customItemNames && db.customItemNames[currentDateStr]) {
        db.items.forEach((originalName) => {
            if (db.customItemNames[currentDateStr][originalName]) {
                map[originalName] = db.customItemNames[currentDateStr][originalName];
            }
        });
    }
    return map;
}

function syncToGASSilent() {
    if (syncTimer) clearTimeout(syncTimer);

    syncTimer = setTimeout(() => {
        const url = getGasUrl();
        if (!url) return;
        
        autoCheckActiveItemsForCurrentDate();
        const checkedTargets = Array.from(document.querySelectorAll('.target-item:checked')).map(el => parseInt(el.value));
        const recs = getCurrentDateRecords();
        if (checkedTargets.length === 0) return;

        let payload = {
            action: "syncHomework",
            date: currentDateStr,
            customItemNames: getPayloadCustomNamesMap(),
            tempItems: db.tempItems && db.tempItems[currentDateStr] ? db.tempItems[currentDateStr] : [],
            items: []
        };

        const allItems = getAllItemsForDate();
        checkedTargets.forEach(iIdx => {
            const itemName = getActualItemName(iIdx);
            const letter = String.fromCharCode(65 + iIdx);
            let records = {};

            db.users.forEach((u, uIdx) => {
                if (u.trim() && u.trim() !== "空" && u.trim() !== "從缺") {
                    const uCode = (uIdx + 1).toString().padStart(3, '0');
                    const code = `${letter}-${uCode}`;
                    const st = recs[code];
                    let textStatus = "未繳交";
                    if (st === 'ok') textStatus = "已繳";
                    if (st === 'fix') textStatus = "未訂正";
                    if (st === 'leave') textStatus = "請假";
                    records[uCode] = textStatus;
                }
            });
            payload.items.push({ itemName: itemName, records: records });
        });

        fetch(url, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(payload),
            redirect: "follow"
        }).catch(err => console.error("背景自動同步失敗:", err));
    }, 10000);
}

function syncToGAS() {
    const url = getGasUrl();
    if (!url) return alert("❌ 請先點選「修改設定」，填入 GAS Web App URL！");
    
    autoCheckActiveItemsForCurrentDate();
    const checkedTargets = Array.from(document.querySelectorAll('.target-item:checked')).map(el => parseInt(el.value));
    if (checkedTargets.length === 0) return alert("⚠️ 請先勾選今天有派出的作業項目！");

    const recs = getCurrentDateRecords();
    let payload = {
        action: "syncHomework",
        date: currentDateStr,
        customItemNames: getPayloadCustomNamesMap(),
        tempItems: db.tempItems && db.tempItems[currentDateStr] ? db.tempItems[currentDateStr] : [],
        items: []
    };

    const allItems = getAllItemsForDate();
    checkedTargets.forEach(iIdx => {
        const itemName = getActualItemName(iIdx);
        const letter = String.fromCharCode(65 + iIdx);
        let records = {};

        db.users.forEach((u, uIdx) => {
            if (u.trim() && u.trim() !== "空" && u.trim() !== "從缺") {
                const uCode = (uIdx + 1).toString().padStart(3, '0');
                const code = `${letter}-${uCode}`;
                const st = recs[code];
                let textStatus = "未繳交";
                if (st === 'ok') textStatus = "已繳";
                if (st === 'fix') textStatus = "未訂正";
                if (st === 'leave') textStatus = "請假";
                records[uCode] = textStatus;
            }
        });
        payload.items.push({ itemName: itemName, records: records });
    });

    fetch(url, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload),
        redirect: "follow"
    })
    .then(response => response.text())
    .then(text => {
        try {
            const data = JSON.parse(text);
            if (data.warning === "HOLIDAY_WARNING" || data.isHoliday === true) {
                alert(`⚠️ 【連假靜音提醒】\n目前同步日期：${currentDateStr}\n若已收假，請記得點擊上方按鈕開啟自動推播。`);
            } else {
                alert(`✅ 【${currentDateStr}】資料已成功發送至 Google 試算表！`);
            }
        } catch (e) {
            alert(`✅ 【${currentDateStr}】資料已成功更新至試算表！`);
        }
    })
    .catch(err => {
        console.error("同步錯誤:", err);
        alert("❌ 同步失敗：" + err);
    });
}

function reset() { 
    if(confirm("徹底重設？")){ 
        localStorage.removeItem(storageKey); 
        location.reload(); 
    } 
}

window.onload = load;
